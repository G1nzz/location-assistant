name: Build Chinese Location Assistant
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
permissions:
  contents: read
concurrency:
  group: assistant-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.4'
      - name: Install packaging tool
        run: brew install ldid
      - name: Materialize pinned SideStore and apply overlay
        run: python3 -B scripts/materialize.py
      - name: Build and test
        run: bash project/scripts/assistant/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LocationAssistant-unsigned-for-local-signing
          path: project/.build/artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compile-diagnostics
          path: project/.build/build.log
          if-no-files-found: ignore
